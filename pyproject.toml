
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-genai"
version = "0.1.0"
description = "Generative AI learning and LLMOps project"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv",
    "ollama",
]

[project.optional-dependencies]
rag = [
    "langchain",
    "langchain-community",
    "langchain-ollama",
    "langchain-text-splitters",
    "faiss-cpu",
    "pypdf",
]
cloud = [
    "openai",
    "langchain-openai",
]
api = [
    "fastapi",
    "uvicorn",
]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
